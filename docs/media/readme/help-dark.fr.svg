<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="Il nous manque une vraie panne. Seules des impressions normales ont été capturées. Tout incident de l'app est synthétique.">
<title>Il nous manque une vraie panne. Seules des impressions normales ont été capturées. Tout incident de l'app est synthétique.</title>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
.hl,.scan,.type,.trav{opacity:0}

@media (prefers-reduced-motion:no-preference){

.scan{animation:scan 4.2s linear infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--h));opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 3.6s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.hl{animation:hl 9s ease-in-out infinite both}
@keyframes hl{0%,36%,100%{opacity:0}6%,28%{opacity:1}}
.type{opacity:1;transform-box:fill-box;transform-origin:right center;animation:type 9s steps(19,end) infinite}
@keyframes type{0%{transform:scaleX(1)}16%,30%{transform:scaleX(0)}34%,100%{transform:scaleX(1)}}
.cur{animation:cur 7s linear infinite}
@keyframes cur{0%{transform:translateX(0)}100%{transform:translateX(var(--w))}}
.flow{stroke-dasharray:12 10;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.beat{animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.45}50%{opacity:1}}
.chk{animation:chk 9s ease-in-out infinite;opacity:1}
@keyframes chk{0%,60%{opacity:0}66%,92%{opacity:1}100%{opacity:0}}
.eq{transform-box:fill-box;transform-origin:center;animation:eq 2.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.trav{animation:trav 5s ease-in-out infinite}
@keyframes trav{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(420px);opacity:0}}
.fade{animation:fade 1.2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

}
</style>
<rect width="1280" height="430" fill="#08070a"/>
<g class="fade"><text x="60" y="130" font-size="60" font-weight="800" fill="#f6f1ea" letter-spacing="-1">Il nous manque</text><text x="60" y="200" font-size="60" font-weight="800" fill="#ffb547" letter-spacing="-1">une vraie panne.</text></g><text x="62" y="252" font-size="23" fill="#f6f1ea">Seules des impressions normales ont été capturées.</text><text x="62" y="284" font-size="23" fill="#b9afa3">Tout incident de l'app est synthétique.</text><text x="56" y="396" font-size="112" font-weight="700" class="m" fill="#ffb547">0</text><text x="150" y="388" font-size="24" fill="#f6f1ea">pannes réelles reçues</text><path d="M792 190H888M992 190H1088" stroke="#b9afa3" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round" fill="none"/><g class="trav"><circle cx="760" cy="190" r="9" fill="#ffb547" stroke="#2a2420" stroke-width="2"/></g><circle class="ping" cx="740" cy="190" r="46" fill="none" stroke="#ff5a4d" stroke-width="4"/><circle class="ping" style="animation-delay:1.3s" cx="740" cy="190" r="46" fill="none" stroke="#ff5a4d" stroke-width="4"/><circle cx="740" cy="190" r="46" fill="#0d0b0e" stroke="#2a2420" stroke-width="2.5"/><path d="M740 168v26" stroke="#ff5a4d" stroke-width="7" stroke-linecap="round"/><circle cx="740" cy="212" r="4.5" fill="#ff5a4d"/><circle cx="940" cy="190" r="46" fill="#ffb547" stroke="#2a2420" stroke-width="2.5"/><rect x="916" y="174" width="48" height="34" fill="none" stroke="#2a1b03" stroke-width="4" stroke-linejoin="round"/><path d="M916 176l24 18 24 -18" fill="none" stroke="#2a1b03" stroke-width="4" stroke-linejoin="round"/><circle cx="1140" cy="190" r="46" fill="#0d0b0e" stroke="#2a2420" stroke-width="2.5"/><path d="M1120 192l14 14 28 -32" fill="none" stroke="#ffb547" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="296" text-anchor="middle" font-size="19" font-weight="600" fill="#f6f1ea">Ta U1 s'arrête</text><text x="940" y="296" text-anchor="middle" font-size="19" font-weight="600" fill="#f6f1ea">Tu envoies un rapport</text><text x="1140" y="296" text-anchor="middle" font-size="19" font-weight="600" fill="#f6f1ea">Les règles sont testées</text>
</svg>
