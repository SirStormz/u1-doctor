<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" role="img" aria-label="Your PC reads: at most 13 GET requests; no command, no G-code, no pause; No cloud. No telemetry. Nothing leaves this PC.">
<title>Your PC reads: at most 13 GET requests; no command, no G-code, no pause; No cloud. No telemetry. Nothing leaves this PC.</title>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
.hl,.scan,.type{opacity:0}

@media (prefers-reduced-motion:no-preference){

.scan{animation:scan 4.2s linear infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--h));opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 3.6s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.hl{animation:hl 9s ease-in-out infinite both}
@keyframes hl{0%,36%,100%{opacity:0}6%,28%{opacity:1}}
.type{opacity:1;transform-box:fill-box;transform-origin:right center;animation:type 9s steps(19,end) infinite}
@keyframes type{0%{transform:scaleX(1)}16%,30%{transform:scaleX(0)}34%,100%{transform:scaleX(1)}}
.cur{animation:cur 7s linear infinite}
@keyframes cur{0%{transform:translateX(0)}100%{transform:translateX(var(--w))}}
.flow{stroke-dasharray:12 10;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.beat{animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.45}50%{opacity:1}}
.chk{animation:chk 9s ease-in-out infinite;opacity:1}
@keyframes chk{0%,60%{opacity:0}66%,92%{opacity:1}100%{opacity:0}}
.eq{transform-box:fill-box;transform-origin:center;animation:eq 2.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.fade{animation:fade 1.2s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

}
</style>
<rect width="1280" height="450" fill="#08070a"/>
<rect x="60" y="80" width="360" height="220" fill="#0d0b0e" stroke="#2a2420" stroke-width="1.5" /><rect x="860" y="80" width="360" height="220" fill="#0d0b0e" stroke="#2a2420" stroke-width="1.5" /><text x="240" y="180" text-anchor="middle" font-size="40" font-weight="800" fill="#f6f1ea">Your PC</text><text x="240" y="226" text-anchor="middle" font-size="20" class="m" fill="#ffb547">U1 Doctor</text><text x="240" y="262" text-anchor="middle" font-size="16" class="m" fill="#b9afa3">runs on 127.0.0.1 only</text><text x="1040" y="180" text-anchor="middle" font-size="40" font-weight="800" fill="#f6f1ea">Your U1</text><text x="1040" y="226" text-anchor="middle" font-size="20" class="m" fill="#ffb547">Moonraker</text><text x="1040" y="262" text-anchor="middle" font-size="16" class="m" fill="#b9afa3">answers read-only requests</text><text x="640" y="150" text-anchor="middle" font-size="19" class="m" fill="#f6f1ea">reads: at most 13 GET requests</text><path d="M850 176H440" stroke="#ffb547" stroke-width="5" fill="none" class="flow"/><path d="M450 162l-22 14 22 14z" fill="#ffb547"/><path d="M430 246H850" stroke="#b9afa3" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" fill="none" opacity=".7"/><g class="beat"><circle cx="640" cy="246" r="22" fill="#08070a" stroke="#ff5a4d" stroke-width="4"/><path d="M628 234l24 24m0 -24l-24 24" stroke="#ff5a4d" stroke-width="4.5" stroke-linecap="round"/></g><text x="640" y="298" text-anchor="middle" font-size="19" class="m" fill="#b9afa3">no command, no G-code, no pause</text><g transform="translate(70 356)"><path d="M20 62a18 18 0 0 1 2-36a28 28 0 0 1 54-6a22 22 0 0 1 8 42z" fill="none" stroke="#b9afa3" stroke-width="3.5" stroke-linejoin="round"/><path d="M6 76L96 2" stroke="#ff5a4d" stroke-width="5" stroke-linecap="round"/></g><text x="190" y="410" font-size="24" font-weight="600" fill="#f6f1ea">No cloud. No telemetry. Nothing leaves this PC.</text>
</svg>
