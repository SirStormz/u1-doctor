<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&amp;family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Permanent+Marker&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#CFCBC3}
.app{--ink:#1D1C1A;--ink2:#4F4C46;--ink3:#7C786F;--lcd:#FFB547;--lcd-ink:#2A1B03;position:relative;min-height:1100px;color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background-color:#CFCBC3;background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.06)),url('/_blob/fb7958df8bc2671a9325a021e85c7871');background-size:100% 100%,384px 384px}
.app *{box-sizing:border-box}
.app a{color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
.silk{font:600 11.5px/1.2 'Barlow Semi Condensed',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
.dot{font-family:Doto,monospace;font-weight:800;font-variation-settings:"ROND" 100;letter-spacing:.02em}
.hand{font-family:'Permanent Marker',cursive;letter-spacing:.01em}
/* modules usinés */
.mod{position:relative;padding:24px;border-radius:12px;background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08)),url('/_blob/fb7958df8bc2671a9325a021e85c7871');background-size:100% 100%,384px 384px;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.14),0 1px 0 1px rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.06),0 10px 22px -14px rgba(0,0,0,.35)}
.mod::before{content:"";position:absolute;inset:9px;pointer-events:none;background:radial-gradient(circle,#8E897F 0 1.4px,transparent 1.6px) center/4px 1px no-repeat,radial-gradient(circle at 45% 40%,#E7E3DB 0 2.2px,#A9A399 3.6px,rgba(0,0,0,.25) 4.1px,transparent 4.6px) left top/10px 10px no-repeat,radial-gradient(circle at 45% 40%,#E7E3DB 0 2.2px,#A9A399 3.6px,rgba(0,0,0,.25) 4.1px,transparent 4.6px) right top/10px 10px no-repeat,radial-gradient(circle at 45% 40%,#E7E3DB 0 2.2px,#A9A399 3.6px,rgba(0,0,0,.25) 4.1px,transparent 4.6px) left bottom/10px 10px no-repeat,radial-gradient(circle at 45% 40%,#E7E3DB 0 2.2px,#A9A399 3.6px,rgba(0,0,0,.25) 4.1px,transparent 4.6px) right bottom/10px 10px no-repeat}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:13px;margin-bottom:16px}
.groove{height:2px;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(255,255,255,.55));border:0;margin:16px 0}
/* plaque signalétique alu brossé */
.plate{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 12px;border-radius:7px;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 2px,rgba(255,255,255,.18) 2px 3px),linear-gradient(180deg,#E9E7E2,#BDB9B1);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.18);text-decoration:none}
.plate b{font:700 15px/1 'Barlow Semi Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#2B2A27;text-shadow:0 1px 0 rgba(255,255,255,.7)}
/* LCD ambre */
.lcd{position:relative;padding:16px 20px;border-radius:7px;background:linear-gradient(180deg,#FFBE5C,#FFAF3E);color:var(--lcd-ink);box-shadow:inset 0 2px 8px rgba(90,45,0,.5),inset 0 0 0 1px rgba(70,35,0,.35),0 0 0 5px #1E1D1B,0 0 0 6px rgba(255,255,255,.45),0 1px 0 7px rgba(0,0,0,.08)}
.lcd::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:radial-gradient(rgba(42,27,3,.085) .9px,transparent 1.1px),linear-gradient(115deg,rgba(255,255,255,.22) 0 18%,rgba(255,255,255,0) 18.5%);background-size:4px 4px,100% 100%}
.lcd input{width:100%;border:0;outline:none;background:none;color:var(--lcd-ink);font:800 22px/1 Doto,monospace;font-variation-settings:"ROND" 100;letter-spacing:.05em}
.lcd input::placeholder{color:rgba(42,27,3,.3)}
.ty{display:inline-block;clip-path:inset(0 100% 0 0);animation:ty 1s steps(18,end) forwards}
@keyframes ty{to{clip-path:inset(0 0 0 0)}}
.cur{display:inline-block;width:.55em;height:.85em;margin-left:.1em;vertical-align:-.04em;background:var(--lcd-ink);animation:bl .55s steps(1) 2.4s 5 both}
@keyframes bl{50%{opacity:0}}
/* voyants */
.led{display:inline-block;width:13px;height:13px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#B9B4AA,#7E7970 70%);box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 0 0 2px #2A2926,0 0 0 3px rgba(255,255,255,.5)}
.led.g{background:radial-gradient(circle at 35% 30%,#E4FFE9,#3FD06F 45%,#178A3C)}
.led.a{background:radial-gradient(circle at 35% 30%,#FFF1CF,#FFAD1F 45%,#B06800)}
.led.big{width:20px;height:20px}
.led.post{animation:post 1ms linear both}
@keyframes post{from,to{background:radial-gradient(circle at 35% 30%,#B9B4AA,#7E7970 70%)}}
/* touches à course */
.key{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:9px;background:linear-gradient(180deg,#F8F6F1,#DEDAD1);color:var(--ink);font:700 13.5px/1 'Barlow Semi Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.22),0 4px 0 #A6A196,0 6px 8px rgba(0,0,0,.18);transition:transform .05s,box-shadow .05s}
.key:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.22),0 1px 0 #A6A196,0 2px 3px rgba(0,0,0,.15)}
.key-a{background:linear-gradient(180deg,#FFCA74,#FFAA2C);color:#2A1B03;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(110,60,0,.45),0 4px 0 #BD7A10,0 6px 8px rgba(0,0,0,.18)}
.key-a:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(110,60,0,.45),0 1px 0 #BD7A10}
.key-k{background:linear-gradient(180deg,#3B3935,#1E1D1B);color:#F2EFE8;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px #000,0 4px 0 #000,0 6px 8px rgba(0,0,0,.25)}
.key-k:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px #000,0 1px 0 #000}
.key.txt{text-transform:none;letter-spacing:0;font:600 15px/1.2 Barlow,sans-serif;justify-content:flex-start;text-align:left;padding:0 16px}
.key[disabled]{opacity:.45;cursor:not-allowed;transform:none}
/* interrupteur à glissière */
.slide{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.slide .tr{position:relative;width:64px;height:30px;border-radius:7px;background:#262522;box-shadow:inset 0 2px 5px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.55)}
.slide .kn{position:absolute;top:3px;left:3px;width:29px;height:24px;border-radius:5px;background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(0,0,0,.14) 5px 6px),linear-gradient(180deg,#F8F6F1,#CFCAC0);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.5);transition:left .2s cubic-bezier(.3,.7,.2,1)}
.slide.r .kn{left:32px}
.slide:hover .kn{left:17px}
.slide .on{color:var(--ink)}.slide .off{color:var(--ink3)}
/* ruban adhésif */
.tape{display:inline-flex;align-items:center;justify-content:center;padding:5px 14px;background:linear-gradient(180deg,rgba(242,232,203,.96),rgba(232,220,186,.96));color:#2C2A26;box-shadow:0 1px 2px rgba(0,0,0,.2);clip-path:polygon(1.5% 6%,98% 0,100% 48%,98.5% 100%,0 95%,1% 50%)}
/* fenêtre noire */
.win{position:relative;border-radius:9px;background:#0F1012;overflow:hidden;box-shadow:inset 0 4px 14px rgba(0,0,0,.85),0 0 0 2px #1C1B19,0 0 0 4px rgba(0,0,0,.25),0 1px 0 5px rgba(255,255,255,.45)}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,0) 0 52%,rgba(255,255,255,.07) 52.5% 60%,rgba(255,255,255,0) 60.5%)}
.vf{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;background:linear-gradient(#FFB547,#FFB547) left top/12px 2px no-repeat,linear-gradient(#FFB547,#FFB547) left top/2px 12px no-repeat,linear-gradient(#FFB547,#FFB547) right top/12px 2px no-repeat,linear-gradient(#FFB547,#FFB547) right top/2px 12px no-repeat,linear-gradient(#FFB547,#FFB547) left bottom/12px 2px no-repeat,linear-gradient(#FFB547,#FFB547) left bottom/2px 12px no-repeat,linear-gradient(#FFB547,#FFB547) right bottom/12px 2px no-repeat,linear-gradient(#FFB547,#FFB547) right bottom/2px 12px no-repeat}
.wtag{position:absolute;padding:5px 8px;border-radius:3px;background:#FFB547;color:#2A1B03;font:800 13px/1 Doto,monospace;font-variation-settings:"ROND" 100}
/* galvanomètre */
.meter{position:relative}
.meter img{display:block;width:100%;height:auto}
.meter svg{position:absolute;inset:0;width:100%;height:100%}
.needle{transform-box:view-box;transform-origin:595px 605px;animation:swing 1.8s cubic-bezier(.2,.9,.3,1) .6s both}
@keyframes swing{0%{transform:rotate(-50deg)}55%{transform:rotate(calc(var(--a) + 6deg))}75%{transform:rotate(calc(var(--a) - 2.5deg))}90%{transform:rotate(calc(var(--a) + 1deg))}100%{transform:rotate(var(--a))}}
/* bouton photo */
.knob{position:relative;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 8px 14px -6px rgba(0,0,0,.45)}
.knob img{position:absolute;width:120%;height:120%;left:-10%;top:-10%;transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
/* levier */
.tg{position:relative;width:44px;height:58px;flex-shrink:0}
.tg .pl{position:absolute;left:4px;top:4px;width:36px;height:50px;border-radius:6px;background:linear-gradient(#DCD8D0,#C6C2B9);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(0,0,0,.18)}
.tg .nut{position:absolute;left:12px;top:19px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FAF8F4,#9C978D);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.3)}
.tg .lev{position:absolute;left:18px;top:5px;width:8px;height:24px;border-radius:4px;background:linear-gradient(90deg,#8C877D,#FAF8F4 45%,#ABA69C);box-shadow:0 1px 2px rgba(0,0,0,.45);transform-origin:50% 100%;transform:rotate(180deg);transition:transform .14s cubic-bezier(.3,.7,.2,1)}
.tg .lev::before{content:"";position:absolute;left:-2px;top:-4px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFFFFF,#B4AFA5);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.on .tg .lev{transform:rotate(0deg)}
/* ticket */
.slot{height:16px;border-radius:8px;background:#141312;box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.6)}
.paperwrap{position:relative;margin:-8px 14px 0;padding-bottom:12px;overflow:hidden;filter:drop-shadow(0 6px 6px rgba(0,0,0,.22));transition:height 2.2s steps(22,end)}
.paper{position:relative;padding:18px 18px 22px;background:#FBFAF5;color:#2B2A27;font:400 13.5px/1.55 'Courier Prime',monospace}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(135deg,#FBFAF5 50%,transparent 50%) 0 0/12px 10px repeat-x,linear-gradient(225deg,#FBFAF5 50%,transparent 50%) 0 0/12px 10px repeat-x;transform:translateY(100%)}
.hr{border-top:1px dashed #9B978E;margin:8px 0}
/* dock = rangée de touches */
.dock{position:sticky;bottom:18px;z-index:10;display:flex;gap:14px;width:max-content;max-width:calc(100% - 32px);margin:42px auto 0;padding:13px 18px 10px;border-radius:14px;background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.03)),url('/_blob/fb7958df8bc2671a9325a021e85c7871');background-size:100% 100%,384px 384px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(0,0,0,.18),0 12px 24px -10px rgba(0,0,0,.4)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:96px;text-decoration:none;color:var(--ink2)}
.dock .cap{position:relative;width:58px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(180deg,#F8F6F1,#DEDAD1);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.22),0 4px 0 #A6A196;transition:transform .05s,box-shadow .05s}
.dock a.on .cap{transform:translateY(3px);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.22),0 1px 0 #A6A196;background:linear-gradient(180deg,#E8E4DC,#D3CFC6)}
.dock a.on .cap::before{content:"";position:absolute;top:-11px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1CF,#FFAD1F 45%,#B06800);box-shadow:0 0 0 1.5px #2A2926}
.dock a.on{color:var(--ink)}
.dock .silk{color:inherit;font-size:10.5px}
.tip{position:relative;cursor:help}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:max-content;max-width:280px;padding:10px 12px;border-radius:7px;background:#1D1C1A;color:#F2EFE8;font:400 13.5px/1.5 Barlow,sans-serif;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.tip.dn::after{bottom:auto;top:calc(100% + 10px)}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{opacity:1}
.dotted{border-bottom:1px dotted var(--ink3)}
.kv{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 13px;margin:0;font-size:15px}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.app :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:960px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)!important}.span2{grid-row:auto!important}.dock a{min-width:58px}.hide-sm{display:none!important}.wrap{padding:0 16px}}
@media (prefers-reduced-motion:reduce){.app *{animation:none!important;transition:none!important}.ty{clip-path:none}.needle{transform:rotate(var(--a))}}
</style>
