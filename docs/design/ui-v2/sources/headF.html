<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
.app{--bg:#0B0D10;--card:#14171C;--card2:#191D23;--line:rgba(255,255,255,.08);--ink:#F2F4F7;--ink2:rgba(242,244,247,.68);--ink3:rgba(242,244,247,.56);--amber:#FFB547;--ok:#8FD9A8;position:relative;min-height:1100px;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.app *{box-sizing:border-box}
.app a{color:inherit}
.h{font-weight:600;letter-spacing:-.035em}
.mono{font-family:'Geist Mono',monospace;letter-spacing:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
.lbl{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink3)}
/* verre liquide */
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.045));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.10),0 24px 48px -24px rgba(0,0,0,.75)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 72%,rgba(255,255,255,.05))}
.lq{-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:url(#lq) blur(16px) saturate(180%)}
.solid{background:var(--card);border-radius:24px;box-shadow:inset 0 0 0 1px var(--line)}
/* barre de navigation flottante */
.nav{position:absolute;z-index:20;left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:7px 8px 7px 18px;border-radius:999px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:700;font-size:16px;letter-spacing:-.01em}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.seg>a,.seg>span,.seg>button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:32px;padding:0 15px;border:0;background:none;border-radius:999px;font:600 13.5px/1 'Geist',sans-serif;color:var(--ink2);text-decoration:none;cursor:pointer}
.seg .on{color:var(--ink)}
.seg>.thumb,.thumb{position:absolute;z-index:0;top:3px;bottom:3px;height:auto;padding:0;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.35);transition:left .45s cubic-bezier(.34,1.45,.64,1),width .45s cubic-bezier(.34,1.45,.64,1)}
.ibtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:var(--ink2);cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.16);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.07)}
.chip.dash{background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border:0;border-radius:999px;font:600 15.5px/1 'Geist',sans-serif;color:var(--ink);text-decoration:none;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.45,.64,1),background .2s}
.btn:hover{transform:scale(1.03)}
.btn:active{transform:scale(.97)}
.btn-a,.app a.btn-a{background:linear-gradient(180deg,#FFC872,#FFAE34);color:#241600;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(120,60,0,.25),0 10px 24px -12px rgba(0,0,0,.8)}
.btn-g{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 1px rgba(255,255,255,.10)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
/* états */
.st{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:600}
.st i{width:8px;height:8px;border-radius:50%}
.s-w{background:rgba(255,181,71,.16);color:#FFD18A}.s-w i{background:var(--amber)}
.s-o{background:rgba(143,217,168,.13);color:var(--ok)}.s-o i{background:var(--ok)}
.s-u{background:rgba(255,255,255,.06);color:var(--ink2)}.s-u i{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
/* loupe liquide */
.lens{position:absolute;z-index:6;border-radius:50%;background-color:#0E1013;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 14px 22px -8px rgba(255,255,255,.35),inset 0 -18px 30px -10px rgba(0,0,0,.6),0 30px 60px -20px rgba(0,0,0,.85);animation:lensin .9s cubic-bezier(.34,1.45,.64,1) .5s both}
.lens::after{content:"";position:absolute;inset:6px;border-radius:50%;pointer-events:none;background:radial-gradient(120% 60% at 30% 8%,rgba(255,255,255,.28),rgba(255,255,255,0) 45%)}
@keyframes lensin{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.stem{position:absolute;z-index:5;height:1.5px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.15));transform-origin:0 50%}
.pin{position:absolute;z-index:6;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(11,13,16,.85),0 0 0 4.5px rgba(255,255,255,.6)}
/* dock */
.dock{position:sticky;bottom:22px;z-index:20;display:flex;gap:4px;width:max-content;max-width:calc(100% - 32px);margin:42px auto 0;padding:6px;border-radius:30px}
.dock a{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:98px;padding:10px 12px 9px;border-radius:24px;color:var(--ink2);text-decoration:none;font-size:12.5px;font-weight:600;transition:background .2s,color .2s}
.dock a:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.dock a.on{color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.10));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.dock a.on svg{color:var(--amber)}
.tip{position:relative;cursor:help}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:max-content;max-width:280px;padding:10px 13px;border-radius:16px;background:rgba(30,34,40,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 30px -10px rgba(0,0,0,.8);color:var(--ink);font:500 13.5px/1.5 'Geist',sans-serif;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.tip.dn::after{bottom:auto;top:calc(100% + 10px)}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{opacity:1}
.dotted{border-bottom:1px dotted var(--ink3)}
.kv{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 14px;margin:0;font-size:15px}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.rise{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
/* signature de mouvement Obsidienne : le verre se pose (ressort), puis un reflet le traverse une fois */
.settle{opacity:0;transform:translateY(22px) scale(.965);animation:settle .95s cubic-bezier(.34,1.32,.64,1) forwards}
@keyframes settle{60%{opacity:1}to{opacity:1;transform:none}}
.glint{overflow:hidden}
.glint::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.20) 49%,rgba(255,255,255,.05) 53%,transparent 62%) no-repeat;background-size:260% 100%;background-position:130% 0;animation:glint 1.5s cubic-bezier(.4,0,.2,1) forwards;animation-delay:inherit}
@keyframes glint{to{background-position:-40% 0}}
.u1p,.u1c{position:absolute;inset:0;width:100%;height:100%;display:block}
.u1p{transition:opacity .7s cubic-bezier(.2,.8,.2,1)}
.u1c{opacity:0;transition:opacity .7s cubic-bezier(.2,.8,.2,1)}
.live .u1c{opacity:1}.live .u1p{opacity:0}
/* changement d'étape : le texte se remplace en glissant */
.swp0{animation:swp0 .45s cubic-bezier(.2,.8,.2,1)}.swp1{animation:swp1 .45s cubic-bezier(.2,.8,.2,1)}.swp2{animation:swp2 .45s cubic-bezier(.2,.8,.2,1)}
@keyframes swp0{from{opacity:0;transform:translateY(6px)}}@keyframes swp1{from{opacity:0;transform:translateY(6px)}}@keyframes swp2{from{opacity:0;transform:translateY(6px)}}
/* chiffres : chasse fixe pour que les valeurs ne sautent pas */
.app{font-variant-numeric:tabular-nums}
.app :focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:960px){.g2,.g3{grid-template-columns:minmax(0,1fr)!important}.hide-sm{display:none!important}.wrap{padding:0 16px}.dock a{min-width:62px}}
@media (prefers-reduced-motion:reduce){.app *{animation:none!important;transition:none!important}.rise,.settle{opacity:1;transform:none}.glint::before{display:none}}
/* transparence réduite : le verre devient une plaque opaque lisible */
@media (prefers-reduced-transparency:reduce){.glass,.btn-g,.tip::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:#1C2027!important}.glass::after{display:none}}
.nav .seg:has(>:nth-child(1):hover) .thumb{left:3px!important}
.nav .seg:has(>:nth-child(2):hover) .thumb{left:50%!important}
/* interrupteur liquide */
.sw{position:relative;width:52px;height:32px;flex-shrink:0;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);transition:background .3s}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:linear-gradient(180deg,#FFFFFF,#DADDE2);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(0,0,0,.45);transition:left .45s cubic-bezier(.34,1.45,.64,1),width .2s}
.on .sw,.sw.on{background:var(--amber)}
.on .sw::before,.sw.on::before{left:23px}
button:active .sw::before{width:32px}
/* infobulles : hors du flux tant qu'elles sont fermées (sinon elles élargissent la page à droite) */
.tip::after{display:none}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{display:block;animation:tipin .16s ease-out}
@keyframes tipin{from{opacity:0}}
.tip.tl::after{left:auto;right:0;transform:none}
/* héros composés à 1440 px : réduits par paliers sous cette largeur (fenêtre de bureau plus étroite) */
@media (max-width:1439px){.h1440{zoom:.93}}
@media (max-width:1339px){.h1440{zoom:.86}}
@media (max-width:1239px){.h1440{zoom:.78}}
@media (max-width:1129px){.h1440{zoom:.7}}
</style>
