<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500..900&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.app{--paper:#FFFFFF;--wash:#F4F3EF;--grey:#E4E1DA;--ink:#1D1C1A;--ink2:#55534E;--ink3:#85827B;--amber:#FFB547;--amber-soft:#FFF0D6;--ok:#2F7D47;--okfill:#DDF0E1;position:relative;min-height:1100px;background:var(--paper);color:var(--ink);font:400 16px/1.55 'Atkinson Hyperlegible Next',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.app a{color:inherit}
.t{font-family:'Schibsted Grotesk',sans-serif;font-weight:800;letter-spacing:-.02em}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
.top{display:flex;align-items:center;gap:16px;height:80px;padding:0 40px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font:800 21px/1 'Schibsted Grotesk',sans-serif;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border:2px solid var(--ink);border-radius:999px;background:#fff;font:700 13.5px/1 'Atkinson Hyperlegible Next',sans-serif;white-space:nowrap}
.pill.dash{border-style:dashed;color:var(--ink2)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.seg>*{display:inline-flex;align-items:center;height:36px;padding:0 15px;font:700 14px/1 'Atkinson Hyperlegible Next',sans-serif;text-decoration:none;color:var(--ink2)}
.seg>*+*{border-left:2px solid var(--ink)}
.seg>*:first-child{border-radius:9px 0 0 9px}.seg>*:last-child{border-radius:0 9px 9px 0}
.seg .on{background:var(--amber);color:var(--ink)}
.seg a:hover{background:var(--wash);color:var(--ink)}
.box{position:relative;border:2px solid var(--ink);border-radius:18px;background:#fff}
.box.wash{background:var(--wash)}
.lbl{font:700 13px/1.2 'Atkinson Hyperlegible Next',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:700 15.5px/1 'Atkinson Hyperlegible Next',sans-serif;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-a{background:var(--amber)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.state{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px;border:2px solid var(--ink);border-radius:999px;font:700 14px/1 'Atkinson Hyperlegible Next',sans-serif;white-space:nowrap}
.s-w{background:var(--amber)}
.s-o{background:var(--okfill);color:var(--ok);border-color:var(--ok)}
.s-u{border-style:dashed;color:var(--ink2)}
.num{width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:50%;background:#fff;font:800 21px/1 'Schibsted Grotesk',sans-serif}
.num.on{background:var(--amber)}
.check{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 8px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:700 14.5px/1 'Atkinson Hyperlegible Next',sans-serif;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.check:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.check .sq{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:7px;background:#fff}
.check.on{background:var(--okfill)}
.check.on .sq{background:var(--amber)}
.field{width:100%;height:50px;padding:0 15px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:600 16px/1 'IBM Plex Mono',monospace;outline:none}
.field:focus{box-shadow:3px 3px 0 var(--amber)}
.field::placeholder{color:var(--ink3)}
.sym{display:inline-flex;align-items:center;min-height:40px;padding:0 15px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-size:14.5px;font-weight:600;text-decoration:none;transition:background .15s}
.sym:hover{background:var(--amber-soft)}
.tip{position:relative;cursor:help}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:max-content;max-width:280px;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:500 13.5px/1.5 'Atkinson Hyperlegible Next',sans-serif;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;box-shadow:3px 3px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
.tip.dn::after{bottom:auto;top:calc(100% + 10px)}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{opacity:1}
.dotted{border-bottom:2px dotted var(--ink3)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px 14px;margin:0;font-size:15px}
.kv dt{color:var(--ink3);font-weight:600}.kv dd{margin:0}
.dock{position:sticky;bottom:20px;z-index:10;display:flex;gap:6px;width:max-content;max-width:calc(100% - 32px);margin:42px auto 0;padding:7px;border:2px solid var(--ink);border-radius:20px;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:100px;padding:9px 12px 8px;border-radius:13px;color:var(--ink2);text-decoration:none;font:700 12.5px/1 'Atkinson Hyperlegible Next',sans-serif}
.dock a:hover{background:var(--wash);color:var(--ink)}
.dock a.on{background:var(--amber);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.pop{opacity:0;transform:translateY(8px);animation:pop .4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.app :focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@media (max-width:960px){.g2,.g3{grid-template-columns:minmax(0,1fr)!important}.dock a{min-width:62px}.hide-sm{display:none!important}.top{padding:0 16px}.wrap{padding:0 16px}}
@media (prefers-reduced-motion:reduce){.app *{animation:none!important;transition:none!important}.pop{opacity:1;transform:none}}
</style>
