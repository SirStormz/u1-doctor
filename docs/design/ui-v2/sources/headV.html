<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400..700&amp;family=Saira:wdth,wght@75..125,300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08070A}
.app{--bg:#08070A;--panel:#100C0C;--line:rgba(255,214,154,.13);--line2:rgba(255,214,154,.28);--ink:#F6F1EA;--ink2:rgba(246,241,234,.74);--ink3:rgba(246,241,234,.56);--gold:#FFB547;--gold2:#FFD99A;--red:#FF3B2F;--redt:#FF7266;position:relative;min-height:1100px;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Saira',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app *{box-sizing:border-box}
.app a{color:inherit}
.h{font-family:'Oxanium','Saira',sans-serif;font-weight:600;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:0}
.cond{font-stretch:80%;font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
/* néon serré : jamais de halo large */
.neon{color:var(--gold2);text-shadow:0 0 1px rgba(255,181,71,.85),0 0 7px rgba(255,181,71,.38)}
.neon-r{color:var(--redt);text-shadow:0 0 1px rgba(255,59,47,.9),0 0 7px rgba(255,59,47,.4)}
/* verre liquide sombre (approximation web) */
.gl{position:relative;border-radius:3px;background:linear-gradient(180deg,rgba(255,196,140,.09),rgba(255,196,140,.025)),rgba(16,11,10,.46);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,226,182,.30),inset 0 0 0 1px rgba(255,214,154,.12),0 30px 60px -30px rgba(0,0,0,.9)}
.gl::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,181,71,.032) 0 1px,transparent 1px 3px)}
.lq{-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:url(#lq) blur(16px) saturate(150%)}
.pn{position:relative;border-radius:3px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
/* équerres d'angle : la signature des panneaux */
.br::after{content:"";position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(var(--gold),var(--gold)) 0 0/15px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 0/1.5px 15px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 0/15px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 0/1.5px 15px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 100%/15px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 100%/1.5px 15px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 100%/15px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 100%/1.5px 15px no-repeat;filter:drop-shadow(0 0 2px rgba(255,181,71,.55));opacity:.9}
/* barre de navigation */
.nav{position:absolute;z-index:20;left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:7px 8px 7px 16px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font:600 16px/1 'Oxanium',sans-serif;letter-spacing:.02em}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:2px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px var(--line)}
.seg>a,.seg>span,.seg>button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:32px;padding:0 15px;border:0;background:none;font:600 12.5px/1 'Oxanium',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-decoration:none;cursor:pointer}
.seg .on{color:var(--gold2)}
.seg>.thumb{position:absolute;z-index:0;top:3px;bottom:3px;height:auto;padding:0;border-radius:1px;background:linear-gradient(180deg,rgba(255,181,71,.30),rgba(255,181,71,.14));box-shadow:inset 0 1px 0 rgba(255,226,182,.5),inset 0 0 0 1px rgba(255,181,71,.55);transition:left .45s cubic-bezier(.34,1.45,.64,1),width .45s cubic-bezier(.34,1.45,.64,1)}
.ibtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;background:rgba(255,214,154,.08);color:var(--ink2);cursor:pointer;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.ibtn:hover{background:rgba(255,214,154,.16);color:var(--gold2)}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink2);background:rgba(255,214,154,.07);box-shadow:inset 0 0 0 1px var(--line)}
.chip.dash{background:none;box-shadow:none;outline:1px dashed rgba(255,214,154,.45);outline-offset:-1px}
.dia{display:inline-block;width:7px;height:7px;transform:rotate(45deg);flex-shrink:0}
/* boutons à coins coupés */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 24px;border:0;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);font:600 14.5px/1 'Oxanium',sans-serif;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.45,.64,1),filter .2s,background .2s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-a{background:linear-gradient(180deg,#FFC874,#FFAB30);color:#1E1100}
.btn-a:hover{filter:brightness(1.07)}
.btn-g{background:rgba(255,214,154,.12);color:var(--gold2)}
.btn-g:hover{background:rgba(255,214,154,.2)}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none;filter:none}
/* états : losange + mot courant */
.st{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 11px;border-radius:2px;font-size:13.5px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;transform:rotate(45deg);flex-shrink:0}
.s-w{background:rgba(255,181,71,.14);color:var(--gold2)}.s-w i{background:var(--gold);box-shadow:0 0 5px rgba(255,181,71,.75)}
.s-o{background:rgba(246,241,234,.08);color:var(--ink)}.s-o i{background:var(--ink)}
.s-u{background:rgba(246,241,234,.04);color:var(--ink2)}.s-u i{box-shadow:inset 0 0 0 1.5px rgba(246,241,234,.62)}
.s-r{background:rgba(255,59,47,.14);color:var(--redt)}.s-r i{background:var(--red);box-shadow:0 0 5px rgba(255,59,47,.8)}
/* dock */
.dock{position:sticky;bottom:22px;z-index:20;display:flex;gap:2px;width:max-content;max-width:calc(100% - 32px);margin:42px auto 0;padding:6px}
.dock a{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:106px;padding:11px 12px 9px;border-radius:2px;color:var(--ink2);text-decoration:none;font-size:12px;font-weight:600;font-stretch:85%;letter-spacing:.07em;text-transform:uppercase;transition:color .2s,background .2s}
.dock a:hover{color:var(--ink);background:rgba(255,214,154,.06)}
.dock a.on{color:var(--gold2);background:linear-gradient(180deg,rgba(255,181,71,.17),rgba(255,181,71,.04))}
.dock a.on::before{content:"";position:absolute;left:26%;right:26%;top:0;height:2px;background:var(--gold);box-shadow:0 0 6px rgba(255,181,71,.8)}
.dock a.on svg{filter:drop-shadow(0 0 3px rgba(255,181,71,.7))}
/* infobulles */
.tip{position:relative;cursor:help}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:max-content;max-width:290px;padding:10px 13px;border-radius:2px;background:rgba(18,13,12,.96);box-shadow:inset 0 0 0 1px rgba(255,181,71,.38),0 14px 30px -10px rgba(0,0,0,.9);color:var(--ink);font:500 13.5px/1.5 'Saira',sans-serif;font-stretch:100%;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.tip.dn::after{bottom:auto;top:calc(100% + 10px)}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{opacity:1}
.dotted{border-bottom:1px dotted var(--ink3)}
.kv{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 14px;margin:0;font-size:15px}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
/* verrou (interrupteur) */
.sw{position:relative;width:54px;height:28px;flex-shrink:0;background:rgba(246,241,234,.10);box-shadow:inset 0 0 0 1px var(--line2);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);transition:background .3s}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#D8D0C5;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);transition:left .45s cubic-bezier(.34,1.45,.64,1),background .3s}
.on .sw,.sw.on{background:var(--gold)}
.on .sw::before,.sw.on::before{left:29px;background:#1E1100}
/* réticule */
.ret{position:absolute;z-index:6;pointer-events:none;overflow:visible}
.ret .ra,.ret .rb,.ret .lk{transform-box:fill-box;transform-origin:center}
.ret .ra{animation:spin 16s linear infinite}
.ret .rb{animation:spin 10s linear infinite reverse}
.ret .lk{animation:lock 1.1s cubic-bezier(.2,.9,.25,1.25) .7s both}
.glow{filter:drop-shadow(0 0 2px rgba(255,181,71,.75))}
.glow-r{filter:drop-shadow(0 0 2px rgba(255,59,47,.8))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lock{from{transform:scale(2);opacity:0}55%{opacity:1}to{transform:none;opacity:1}}
/* allumage : un tube néon qui s'allume */
.pwr{animation:pwr .9s linear both}
@keyframes pwr{0%{opacity:0}8%{opacity:.85}12%{opacity:.1}20%{opacity:1}27%{opacity:.35}36%,100%{opacity:1}}
.rise{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.app :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (max-width:960px){.g2,.g3{grid-template-columns:minmax(0,1fr)!important}.hide-sm{display:none!important}.wrap{padding:0 16px}.dock a{min-width:62px}}
@media (prefers-reduced-motion:reduce){.app *{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}
@media (prefers-reduced-transparency:reduce){.gl,.lq{background:#140F0E;-webkit-backdrop-filter:none;backdrop-filter:none}}
.nav .seg:has(>:nth-child(1):hover) .thumb{left:3px!important}
.nav .seg:has(>:nth-child(2):hover) .thumb{left:50%!important}
</style>
