<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Labo · scène U1 partagée</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px system-ui}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
.c{position:relative;aspect-ratio:1452/1726;background:#08070A}
.c img,.c canvas{position:absolute;inset:0;width:100%;height:100%}
.c img{transition:opacity .6s}
.c.live img{opacity:0}
.l{position:absolute;left:8px;top:6px;z-index:2}
#log{white-space:pre;padding:8px;font:12px monospace}
</style>
</head>
<body>
<div class="g">
<div class="c" id="obsidienne" style="background:#0B0D10"><img src="/lab/r/u1-obs-hero.jpg" alt=""><canvas></canvas><span class="l">obsidienne</span></div>
<div class="c" id="pupitre" style="background:#0B0B0D"><img src="/lab/r/u1-obs-hero.jpg" alt=""><canvas></canvas><span class="l">pupitre</span></div>
<div class="c" id="notice" style="background:#fff"><img src="/lab/r/u1-line-hero.jpg" alt=""><canvas></canvas><span class="l" style="color:#000">notice</span></div>
<div class="c" id="visiere"><img src="/lab/r/u1-vis-hero.jpg" alt=""><canvas></canvas><span class="l">visiere</span></div>
</div>
<div id="log"></div>
<script type="module">
import { mount } from "/lab/dist/u1stage.bundle.js";
const out = {};
window.__stages = out;
for (const id of ["obsidienne", "pupitre", "notice", "visiere"]) {
  const el = document.getElementById(id);
  const t0 = performance.now();
  mount(el.querySelector("canvas"), { theme: id, model: "/models/u1-jay.glb", view: "hero", interactive: true, zoom: true, scan: id === "visiere", drift: false })
    .then((s) => { out[id] = s; el.classList.add("live"); document.getElementById("log").textContent += id + " prêt en " + Math.round(performance.now() - t0) + " ms\n"; })
    .catch((e) => { document.getElementById("log").textContent += id + " ERREUR " + e + "\n"; });
}
</script>
</body>
</html>
