name: Validate U1-DEB bundle
description: Offline check of a U1 Diagnostic Evidence Bundle (structure, size limits, SHA-256, replay). Python stdlib only, no network, nothing executed.
inputs:
  bundle:
    description: Path to the U1-DEB zip, relative to the workspace
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../../backend
        BUNDLE: ${{ inputs.bundle }}
      run: python -m app.deb_cli validate "$BUNDLE"
