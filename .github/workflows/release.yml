name: Release
# Manual run only. Builds the Windows exe on a clean GitHub runner, smoke-tests it, zips it with the licence and a
# SHA-256 file, and creates a DRAFT release (nothing is public until the owner publishes the draft in the GitHub UI).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.6-g1"
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # build provenance: OIDC token for the signing certificate
      attestations: write  # build provenance: store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python environment (the build script expects backend\.venv)
        run: |
          py -3.12 -m venv backend\.venv
          backend\.venv\Scripts\python.exe -m pip install -c backend\constraints-release.txt -e "backend[desktop]" pyinstaller
      - name: Build the one-folder exe
        run: .\scripts\build_windows.ps1
      - name: Zip with the licence and SHA-256
        run: .\scripts\package_zip.ps1
      - name: Smoke test the built exe (local port, temporary database)
        run: |
          $env:U1DOCTOR_PORT = "18900"
          $env:U1DOCTOR_HEADLESS = "1"   # server only: a CI runner has no one to look at a window (the window is checked by hand)
          $env:U1DOCTOR_DB = Join-Path $env:RUNNER_TEMP "smoke.sqlite3"
          $p = Start-Process build\dist\u1-doctor\u1-doctor.exe -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..60) { Start-Sleep 1; try { $h = Invoke-RestMethod http://127.0.0.1:18900/api/v1/health -TimeoutSec 2; $ok = $true; break } catch {} }
          if (-not $ok) { throw "exe did not answer on /api/v1/health" }
          "health: $($h | ConvertTo-Json -Compress)"
          $m = Invoke-WebRequest http://127.0.0.1:18900/models/u1-jay.glb -UseBasicParsing
          if ($m.StatusCode -ne 200) { throw "3D model not served" }
          $i = Invoke-WebRequest http://127.0.0.1:18900/ -UseBasicParsing
          if ($i.StatusCode -ne 200) { throw "UI not served" }
          Get-NetTCPConnection -State Listen -LocalPort 18900 | ForEach-Object { "listening on $($_.LocalAddress):$($_.LocalPort)"; Stop-Process -Id $_.OwningProcess -Force }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Build provenance attestation of the zip (verify with gh attestation verify, see docs/INSTALL.md)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/u1-doctor-*-win64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: u1-doctor-win64
          path: |
            build/u1-doctor-*-win64.zip
            build/u1-doctor-*-win64.zip.sha256.txt
      - name: Create the DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem build\u1-doctor-*-win64.zip).Name
          $sha = (Get-Content "build\$zip.sha256.txt" -Raw).Trim().Split(" ")[0]
          @"
          U1 Doctor, local and read-only diagnostic forensics for the Snapmaker U1. Unofficial: not affiliated with Snapmaker.

          **Windows build ($zip)**, built by GitHub Actions from this commit.

          SHA-256 of the zip: ``$sha``

          Verify before running:

          ``````powershell
          Get-FileHash .\$zip -Algorithm SHA256
          gh attestation verify .\$zip --repo SirStormz/u1-doctor   # optional: build provenance (GitHub CLI)
          ``````

          Notes:
          - The exe is not code-signed, so Windows SmartScreen may warn. Extract with Windows Explorer ("Extract all"), not WinRAR/7-Zip, so Windows keeps the download mark.
          - The app listens on 127.0.0.1 only. It never sends a command that changes a printer. It reads from a printer only when you type its address and tick the approval box on the Connect screen (read-only requests, nothing stored but derived facts).
          - Double-click u1-doctor.exe: the app opens in its own window and starts empty (demo mode is a switch in the header). If the Microsoft WebView2 component is missing, the app offers to install it with Microsoft's own installer shipped in the zip.
          - A VirusTotal scan of this exact zip is added to these notes once it has been run.
          "@ | Set-Content release-notes.md -Encoding utf8
          gh release create "${{ inputs.tag }}" "build\$zip" "build\$zip.sha256.txt" --draft --title "U1 Doctor ${{ inputs.tag }}" --notes-file release-notes.md --target "${{ github.sha }}"
